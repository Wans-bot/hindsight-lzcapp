version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/hindsight.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app
build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: hindsight
    source: ghcr.io/vectorize-io/hindsight
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: false
  private:
    enabled: false
